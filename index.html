<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏰 닮음의 저택 - 수학 방탈출 게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #8B4513 0%, #D2691E 100%);
            color: white;
            padding: 30px;
            text-align: center;
            border-bottom: 5px solid #654321;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        /* 학생정보 입력 화면 */
        .player-info-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 30px;
            text-align: center;
            color: white;
            min-height: 500px;
        }

        .player-info-screen.hidden {
            display: none;
        }

        .info-title {
            font-size: 2.2em;
            color: #FFD700;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .info-subtitle {
            font-size: 1.2em;
            color: #E0E0E0;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: center;
        }

        .form-group label {
            display: block;
            color: #FFD700;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .form-group input {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1em;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-group input:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 10px #FFD700;
        }

        .btn-start-game {
            background: linear-gradient(135deg, #00FF00 0%, #00CC00 100%);
            color: black;
            padding: 15px 50px;
            font-size: 1.2em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .btn-start-game:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 255, 0, 0.4);
        }

        .btn-start-game:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .error-message {
            color: #FF4444;
            margin-top: 15px;
            font-weight: bold;
            display: none;
        }

        /* 게임 화면 */
        .game-screen {
            display: none;
        }

        .game-screen.active {
            display: block;
        }

        .timer-section {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            border-bottom: 2px solid #667eea;
        }

        .timer-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #667eea;
        }

        .timer-box h3 {
            color: #FFD700;
            font-size: 0.85em;
            margin-bottom: 8px;
        }

        .timer-value {
            color: #00FF00;
            font-size: 1.6em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        .player-name-display {
            color: #00BFFF;
            font-size: 0.9em;
        }

        .content {
            padding: 30px;
            color: white;
        }

        .section {
            display: none;
            animation: slideIn 0.5s ease;
        }

        .section.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            font-size: 1.8em;
            color: #FFD700;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            border-bottom: 3px solid #FFD700;
            padding-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            margin-bottom: 30px;
            overflow: hidden;
            border: 2px solid #667eea;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00FF00, #FFD700);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-weight: bold;
            font-size: 0.9em;
        }

        .problem-block {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .problem-number {
            color: #FFD700;
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .problem-text {
            color: #E0E0E0;
            margin-bottom: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .answer-input {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            border: 2px solid #667eea;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1em;
        }

        .answer-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .answer-input:focus {
            outline: none;
            border-color: #FFD700;
            box-shadow: 0 0 10px #FFD700;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-hint {
            background: linear-gradient(135deg, #FFA500 0%, #FF8C00 100%);
            color: white;
            padding: 10px 15px;
            font-size: 0.9em;
        }

        .btn-hint:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 165, 0, 0.4);
        }

        .btn-hint:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .hint-box {
            background: rgba(255, 165, 0, 0.2);
            border-left: 4px solid #FFD700;
            padding: 15px;
            margin-top: 10px;
            border-radius: 5px;
            display: none;
            color: #FFE0B2;
            font-size: 0.95em;
        }

        .hint-box.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .hint-counter {
            font-size: 0.8em;
            color: #FFD700;
            margin-top: 5px;
        }

        .feedback {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: rgba(0, 255, 0, 0.2);
            border: 2px solid #00FF00;
            color: #00FF00;
        }

        .feedback.incorrect {
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #FF4444;
            color: #FF8888;
        }

        .section-navigation {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-nav {
            padding: 12px 20px;
            border: 2px solid #667eea;
            background: transparent;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-nav:hover:not(:disabled) {
            background: #667eea;
            color: white;
        }

        .btn-nav.active {
            background: #667eea;
            color: white;
        }

        .btn-nav:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 최종 화면 */
        .final-screen {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .final-screen.active {
            display: block;
        }

        .final-screen h2 {
            font-size: 2.5em;
            color: #FFD700;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .final-player-info {
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid #FFD700;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .final-player-info h3 {
            color: #00BFFF;
            font-size: 1.3em;
            margin-bottom: 10px;
        }
